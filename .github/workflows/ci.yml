name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      APP_URL: https://app.commontime.studio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Unit and invariant tests
        run: node --test tests/*.test.mjs
      - name: TypeScript
        run: npm exec next typegen && npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build -- --webpack

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: supabase/setup-cli@v2
        with:
          version: 2.90.0
      - name: Replay migrations on a clean local database
        run: supabase db start
      - name: Lint the resulting database
        run: supabase db lint --local --level warning
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
