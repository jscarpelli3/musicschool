name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      APP_URL: https://app.commontime.studio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Unit and invariant tests
        run: node --test tests/*.test.mjs
      - name: TypeScript
        run: npm exec next typegen && npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build -- --webpack

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect database migration changes
        id: database_changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- supabase/migrations; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.database_changes.outputs.required == 'true'
        with:
          node-version: 22
      - uses: supabase/setup-cli@v2
        if: steps.database_changes.outputs.required == 'true'
        with:
          version: 2.90.0
      - name: Authenticate Supabase image pulls
        if: steps.database_changes.outputs.required == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Replay migrations on a clean local database
        if: steps.database_changes.outputs.required == 'true'
        run: |
          for attempt in 1 2 3; do
            if supabase db start; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Lint the resulting database
        if: steps.database_changes.outputs.required == 'true'
        run: supabase db lint --local --level warning
      - name: Stop local Supabase
        if: always() && steps.database_changes.outputs.required == 'true'
        run: supabase stop --no-backup
