name: Push notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-notification-worker
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deliver queued browser notifications
        env:
          PUSH_WORKER_SECRET: ${{ secrets.PUSH_WORKER_SECRET }}
        run: |
          test -n "$PUSH_WORKER_SECRET"
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer $PUSH_WORKER_SECRET" \
            https://app.commontime.studio/api/cron/push-notifications
